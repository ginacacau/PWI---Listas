<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craftsy - Login</title>
<link rel="stylesheet" href="css/stylelogin.css">
</head>
<body>

<header>
 
  <div class="logo">Craftsy</div>
  <nav>
    <ul>
      <li><a href="index.html">SMARTPHONES</a></li>
      <li><a href="index.html">TABLETS</a></li>
      <li><a href="index.html">COMPUTADORES</a></li>
    </ul>
  </nav>
  <div class="auth-links">
    <a href="login.html">LOGIN</a>
    <a href="registrar.html">REGISTRAR</a>
  </div>
</header>

<main>
  <form class="login-box">
    <h1>BEM-VINDO</h1>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="email@email.com">
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="senha">
    </div>

    <div class="remember">
      <input type="checkbox" id="lembrar" name="lembrar">
      <label for="lembrar">Lembrar de mim</label>
    </div>

    <p class="error-message">A combinação de email e senha não é válida.</p>

    <button type="submit" class="btn-entrar">Entrar</button>
  </form>
</main>

</body>
</html>
